<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Álbum Premium</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap');
:root{--bg:#f6f2ea;--ink:#28241f;--mut:#756d62;--line:#ddd3c5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Montserrat',system-ui,-apple-system,sans-serif}button,input{font:inherit}.hero{text-align:center;padding:40px 16px 20px}.hero small{display:block;font-family:'Cinzel',serif;font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#756d62}h1{font-family:'Cinzel',serif;font-weight:600;font-size:clamp(34px,8.5vw,56px);line-height:1.08;letter-spacing:.02em;margin:10px 0 8px}.sub,.count{color:var(--mut)}.ticker{overflow:hidden;margin:15px 0 25px}.track{display:flex;gap:12px;width:max-content;animation:roll 45s linear infinite}.track img{width:145px;height:188px;object-fit:cover;border-radius:18px}@keyframes roll{to{transform:translateX(-50%)}}.actions{text-align:center;padding:0 15px 28px}.primary,.secondary{border:0;border-radius:99px;padding:14px 20px;font-family:'Montserrat',sans-serif;font-weight:700;letter-spacing:-.01em}.primary{background:var(--ink);color:#fff}.secondary{background:#fff;border:1px solid var(--line)}.gallery{columns:2 150px;column-gap:10px;max-width:1000px;margin:auto;padding:0 14px 90px}.card{break-inside:avoid;position:relative;margin-bottom:10px;content-visibility:auto;contain-intrinsic-size:220px 320px}.card img{width:100%;display:block;border-radius:16px}.who{position:absolute;bottom:7px;left:7px;right:7px;background:#0008;color:#fff;padding:7px;border-radius:10px;font-size:11px}.empty{text-align:center;color:var(--mut);padding:30px}.fab{position:fixed;right:18px;bottom:18px;width:58px;height:58px;border:0;border-radius:50%;background:var(--ink);color:#fff;font-size:26px}.toast{position:fixed;z-index:60;top:15px;left:50%;transform:translate(-50%,-100px);transition:.3s;background:var(--ink);color:white;padding:12px 18px;border-radius:99px;max-width:92%;text-align:center}.toast.show{transform:translate(-50%,0)}.modal{display:none;position:fixed;inset:0;z-index:40;background:#000a;align-items:center;justify-content:center;padding:14px}.modal.open{display:flex}.panel{width:min(96vw,520px);max-height:95vh;overflow:auto;background:#fffdf8;border-radius:24px;padding:17px}.close{float:right;border:0;background:none;font-size:25px}.editor{position:relative;aspect-ratio:9/16;background:#ddd;overflow:hidden;border-radius:18px;touch-action:none}.editor canvas,.frame{position:absolute;inset:0;width:100%;height:100%}.frame{object-fit:contain;pointer-events:none}.controls{display:grid;gap:10px;margin-top:12px}.file{display:block;text-align:center;padding:12px;border:1px solid var(--line);border-radius:99px}.file input{display:none}.name{padding:13px;border:1px solid var(--line);border-radius:12px}.row{display:flex;gap:8px}.row>*{flex:1}.status{font-size:12px;color:var(--mut);min-height:18px}.light img{max-width:92vw;max-height:82vh;border-radius:18px}.cap{color:white;text-align:center;margin-top:8px}@media(min-width:760px){.gallery{columns:3 220px}}
</style></head><body>
<header class="hero"><small>Compartilhando momentos</small><h1 id="title">Álbum Online</h1><div class="sub" id="sub"></div><div class="count" id="count"></div></header>
<section class="ticker" id="ticker" hidden><div class="track" id="track"></div></section>
<div class="actions"><button class="primary" id="add">＋ Adicionar meu momento</button></div><main id="gallery" class="gallery"></main><div id="empty" class="empty">Ainda não há momentos compartilhados. Seja o primeiro ✨</div><button id="fab" class="fab">＋</button><div id="toast" class="toast"></div>
<div id="creator" class="modal"><div class="panel"><button id="close" class="close">×</button><h2>Crie seu momento</h2><div id="editor" class="editor"><canvas id="cv" width="1080" height="1920"></canvas><img id="frame" class="frame"></div><div class="controls"><label class="file">Escolher ou tirar foto<input id="file" type="file" accept="image/*"></label><label>Zoom <input id="zoom" type="range" min="1" max="4" value="1" step=".01"></label><input id="guest" class="name" maxlength="50" placeholder="Seu nome (obrigatório)"><div class="row"><button id="share" class="secondary">Compartilhar</button><button id="publish" class="primary">Adicionar ao álbum</button></div><div id="status" class="status"></div></div></div></div>
<div id="light" class="modal light"><div><img id="lightimg"><div id="cap" class="cap"></div></div></div>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{const C=ALBUM_CONFIG,S=supabase.createClient(C.supabaseUrl,C.supabaseKey),q=s=>document.querySelector(s);q("#sub").textContent=C.evento.subtitulo;q("#frame").src=C.moldura;
let rows=[],im=null,sc=1,x=0,y=0,drag=0,sx=0,sy=0,bx=0,by=0;const cv=q("#cv"),cx=cv.getContext("2d"),ed=q("#editor"),url=p=>C.supabaseUrl+"/storage/v1/object/public/"+C.bucket+"/"+p;
function render(){q("#gallery").innerHTML="";rows.forEach(r=>{let a=document.createElement("div");a.className="card";a.innerHTML='<img loading="lazy" decoding="async" src="'+url(r.arquivo)+'"><div class="who">Compartilhada por '+esc(r.nome_convidado)+'</div>';a.onclick=()=>{q("#lightimg").src=url(r.arquivo);q("#cap").textContent="Compartilhada por "+r.nome_convidado;q("#light").classList.add("open")};q("#gallery").append(a)});q("#empty").hidden=!!rows.length;q("#count").textContent=rows.length?rows.length+" momento"+(rows.length==1?"":"s")+" compartilhado"+(rows.length==1?"":"s"):"";let p=rows.slice(0,6);q("#ticker").hidden=!p.length;q("#track").innerHTML=p.length?[...p,...p].map(r=>'<img loading="lazy" decoding="async" src="'+url(r.arquivo)+'">').join(""):""}
function esc(s){let d=document.createElement("div");d.textContent=s;return d.innerHTML}
async function load(){let {data,error}=await S.from("fotos").select("*").eq("evento_id",C.eventoId).order("created_at",{ascending:false}).limit(24);if(!error){rows=data||[];render()}}
function toast(n){let t=q("#toast");t.textContent="✨ "+n+" acabou de adicionar um novo momento";t.classList.add("show");setTimeout(()=>t.classList.remove("show"),4200)}
S.channel("album-"+C.eventoId).on("postgres_changes",{event:"INSERT",schema:"public",table:"fotos",filter:"evento_id=eq."+C.eventoId},p=>{if(!rows.some(r=>r.id===p.new.id)){rows.unshift(p.new);render();toast(p.new.nome_convidado)}}).subscribe();
function open(){q("#creator").classList.add("open");draw()}q("#add").onclick=q("#fab").onclick=open;q("#close").onclick=()=>q("#creator").classList.remove("open");q("#light").onclick=()=>q("#light").classList.remove("open");
function draw(){cx.fillStyle="#ddd";cx.fillRect(0,0,1080,1920);if(im){let s=im.fit*sc;cx.drawImage(im,x,y,im.width*s,im.height*s)}}function fit(){im.fit=Math.max(1080/im.width,1920/im.height);sc=1;q("#zoom").value=1;x=(1080-im.width*im.fit)/2;y=(1920-im.height*im.fit)/2;draw()}
q("#file").onchange=e=>{let f=e.target.files[0];if(!f)return;let z=new Image;z.onload=()=>{im=z;fit()};z.src=URL.createObjectURL(f)};q("#zoom").oninput=e=>{if(!im)return;let old=sc,n=+e.target.value;x=540-(540-x)*n/old;y=960-(960-y)*n/old;sc=n;draw()};
function pos(e){let r=ed.getBoundingClientRect();return{x:(e.clientX-r.left)*1080/r.width,y:(e.clientY-r.top)*1920/r.height}}ed.onpointerdown=e=>{if(!im)return;drag=1;ed.setPointerCapture(e.pointerId);let p=pos(e);sx=p.x;sy=p.y;bx=x;by=y};ed.onpointermove=e=>{if(!drag)return;let p=pos(e);x=bx+p.x-sx;y=by+p.y-sy;draw()};ed.onpointerup=()=>drag=0;
async function compose(){if(!im)throw Error("Escolha uma foto primeiro.");let o=document.createElement("canvas");o.width=1080;o.height=1920;let c=o.getContext("2d");c.drawImage(cv,0,0);let f=new Image;await new Promise((ok,no)=>{f.onload=ok;f.onerror=no;f.src=C.moldura});c.drawImage(f,0,0,1080,1920);return new Promise(ok=>o.toBlob(ok,"image/webp",C.qualidadeWebp||.82))}
q("#share").onclick=async()=>{try{let b=await compose(),f=new File([b],"meu-momento.webp",{type:"image/webp"});if(navigator.canShare?.({files:[f]}))await navigator.share({files:[f],title:C.evento.titulo});else{let a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=f.name;a.click()}}catch(e){q("#status").textContent=e.message}};
q("#publish").onclick=async()=>{let st=q("#status"),n=q("#guest").value.trim();if(!n){st.textContent="Digite seu nome para publicar.";return}try{st.textContent="Preparando…";let b=await compose(),safe=n.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zA-Z0-9]+/g,"-").toLowerCase().slice(0,25)||"convidado",path=C.eventoId+"/"+Date.now()+"-"+safe+"-"+crypto.randomUUID().slice(0,8)+".webp";let u=await S.storage.from(C.bucket).upload(path,b,{contentType:"image/webp",cacheControl:"31536000"});if(u.error)throw u.error;let r=await S.from("fotos").insert({evento_id:C.eventoId,nome_convidado:n,arquivo:path}).select().single();if(r.error)throw r.error;st.textContent="Publicado com sucesso ✨";if(!rows.some(z=>z.id===r.data.id)){rows.unshift(r.data);render()}setTimeout(()=>q("#creator").classList.remove("open"),700)}catch(e){st.textContent="Erro ao publicar: "+e.message}};load()})();
</script></body></html>
