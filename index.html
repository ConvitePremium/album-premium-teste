<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f2ea"><title>Álbum Online</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap');
:root{--bg:#f6f2ea;--paper:#fffdf8;--ink:#28241f;--mut:#756d62;--line:#ddd3c5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Montserrat',system-ui,sans-serif}button,input{font:inherit}.hero{text-align:center;padding:40px 16px 20px}.hero small{display:block;font-family:'Cinzel',serif;font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}h1{font-family:'Cinzel',serif;font-weight:600;font-size:clamp(34px,8.5vw,56px);line-height:1.08;letter-spacing:.02em;margin:10px 0 8px}.sub,.count{color:var(--mut)}.count{margin-top:7px;font-size:14px}.ticker{overflow:hidden;margin:15px 0 25px}.track{display:flex;gap:12px;width:max-content;animation:roll 45s linear infinite;will-change:transform}.track img{width:145px;height:188px;object-fit:cover;border-radius:18px;background:#e5dfd5}@keyframes roll{to{transform:translateX(-50%)}}.actions{text-align:center;padding:0 15px 28px}.primary,.secondary{border:0;border-radius:99px;padding:14px 20px;font-family:'Montserrat',sans-serif;font-weight:700}.primary{background:var(--ink);color:#fff}.secondary{background:#fff;border:1px solid var(--line)}button:disabled{opacity:.55}.gallery{columns:2 150px;column-gap:10px;max-width:1000px;margin:auto;padding:0 14px 30px}.card{break-inside:avoid;position:relative;margin-bottom:10px;content-visibility:auto;contain-intrinsic-size:220px 320px}.card img{width:100%;display:block;border-radius:16px;background:#e5dfd5}.who{position:absolute;bottom:7px;left:7px;right:7px;background:#0008;color:#fff;padding:7px;border-radius:10px;font-size:11px}.empty{text-align:center;color:var(--mut);padding:30px}.sentinel{text-align:center;color:var(--mut);font-size:13px;padding:10px 10px 100px}.fab{position:fixed;right:18px;bottom:18px;width:58px;height:58px;border:0;border-radius:50%;background:var(--ink);color:#fff;font-size:26px;box-shadow:0 10px 30px #0003;z-index:20}.toast{position:fixed;z-index:60;top:15px;left:50%;transform:translate(-50%,-110px);transition:.3s;background:var(--ink);color:white;padding:12px 18px;border-radius:99px;max-width:92%;text-align:center}.toast.show{transform:translate(-50%,0)}.modal{display:none;position:fixed;inset:0;z-index:40;background:#000a;align-items:center;justify-content:center;padding:14px}.modal.open{display:flex}.panel{width:min(96vw,520px);max-height:95vh;overflow:auto;background:var(--paper);border-radius:24px;padding:17px}.close{float:right;border:0;background:none;font-size:25px}.editor{position:relative;aspect-ratio:9/16;background:#ddd;overflow:hidden;border-radius:18px;touch-action:pan-y}.editor canvas,.frame{position:absolute;inset:0;width:100%;height:100%}.frame{object-fit:contain;pointer-events:none}.controls{display:grid;gap:10px;margin-top:12px}.file{display:block;text-align:center;padding:12px;border:1px solid var(--line);border-radius:99px;background:#fff}.file input{display:none}.name{padding:13px;border:1px solid var(--line);border-radius:12px}.row{display:flex;gap:8px}.row>*{flex:1}.status{font-size:12px;color:var(--mut);min-height:18px}.progress{height:5px;background:#e4ddd2;border-radius:9px;overflow:hidden;display:none}.progress i{display:block;height:100%;width:35%;background:var(--ink);border-radius:9px;animation:prog 1s ease-in-out infinite alternate}@keyframes prog{to{transform:translateX(185%)}}.light img{max-width:92vw;max-height:82vh;border-radius:18px}.cap{color:white;text-align:center;margin-top:8px}.success{text-align:center}.success h2{font-family:'Cinzel',serif}.success .check{font-size:48px}.success .row{margin-top:14px}@media(min-width:760px){.gallery{columns:3 220px}}</style></head><body>
<header class="hero"><small>Compartilhando momentos</small><h1>Álbum Online</h1><div class="sub" id="sub"></div><div class="count" id="count"></div></header><section class="ticker" id="ticker" hidden><div class="track" id="track"></div></section><div class="actions"><button class="primary" id="add">＋ Adicionar meu momento</button></div><main id="gallery" class="gallery"></main><div id="empty" class="empty">Ainda não há momentos compartilhados. Seja o primeiro ✨</div><div id="sentinel" class="sentinel"></div><button id="fab" class="fab">＋</button><div id="toast" class="toast"></div>
<div id="creator" class="modal"><div class="panel"><button id="close" class="close">×</button><h2>Crie seu momento</h2><div id="editor" class="editor"><canvas id="cv" width="1080" height="1920"></canvas><img id="frame" class="frame"></div><div class="controls"><div class="row"><label class="file">📷 Abrir câmera<input id="cameraFile" type="file" accept="image/*" capture="environment"></label><label class="file">🖼️ Escolher foto<input id="galleryFile" type="file" accept="image/*"></label></div><div class="status">1 dedo: rolar a página • 2 dedos: ajustar a foto</div><label>Zoom <input id="zoom" type="range" min="1" max="4" value="1" step=".01"></label><input id="guest" class="name" maxlength="50" placeholder="Seu nome (obrigatório)"><div class="row"><button id="share" class="secondary">Compartilhar</button><button id="publish" class="primary">Adicionar ao álbum</button></div><div id="progress" class="progress"><i></i></div><div id="status" class="status"></div></div></div></div>
<div id="success" class="modal"><div class="panel success"><div class="check">✓</div><h2>Momento compartilhado!</h2><p>Sua foto já está no álbum ✨</p><div class="row"><button id="shareAfter" class="secondary">Compartilhar minha foto</button><button id="backAlbum" class="primary">Voltar ao álbum</button></div></div></div>
<div id="light" class="modal light"><div><img id="lightimg"><div id="cap" class="cap"></div></div></div>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{const C=ALBUM_CONFIG,S=supabase.createClient(C.supabaseUrl,C.supabaseKey),q=s=>document.querySelector(s),PAGE=12; q('#sub').textContent=C.evento.subtitulo;q('#frame').src=C.moldura;
let rows=[],page=0,hasMore=true,loading=false,total=0,im=null,sc=1,x=0,y=0,drag=0,sx=0,sy=0,bx=0,by=0,lastBlob=null;const cv=q('#cv'),cx=cv.getContext('2d'),ed=q('#editor');
const full=p=>C.supabaseUrl+'/storage/v1/object/public/'+C.bucket+'/'+p;const thumbPath=p=>p.replace(/([^/]+)$/,'thumbs/$1');const thumb=p=>full(thumbPath(p));
function updateCount(){q('#count').textContent=total?total+' momento'+(total===1?'':'s')+' compartilhado'+(total===1?'':'s'):''}
async function getTotal(){let {count}=await S.from('fotos').select('id',{count:'exact',head:true}).eq('evento_id',C.eventoId);total=count||0;updateCount()}
function imageWithFallback(r,cls=''){let img=document.createElement('img');img.loading='lazy';img.decoding='async';img.className=cls;img.src=thumb(r.arquivo);img.onerror=()=>{if(img.dataset.fallback)return;img.dataset.fallback='1';img.src=full(r.arquivo)};return img}
function card(r){let a=document.createElement('div');a.className='card';let img=imageWithFallback(r),w=document.createElement('div');w.className='who';w.textContent='Compartilhada por '+r.nome_convidado;a.append(img,w);a.onclick=()=>{q('#lightimg').src=full(r.arquivo);q('#cap').textContent='Compartilhada por '+r.nome_convidado;q('#light').classList.add('open')};return a}
function refreshTicker(){let p=rows.slice(0,6);q('#ticker').hidden=!p.length;let tr=q('#track');tr.innerHTML='';[...p,...p].forEach(r=>{let i=imageWithFallback(r);tr.append(i)})}
function append(list,prepend=false){let f=document.createDocumentFragment();list.forEach(r=>f.append(card(r)));prepend?q('#gallery').prepend(f):q('#gallery').append(f);q('#empty').hidden=rows.length>0;refreshTicker()}
async function loadMore(){if(loading||!hasMore)return;loading=true;q('#sentinel').textContent='Carregando mais momentos…';let from=page*PAGE,{data,error}=await S.from('fotos').select('*').eq('evento_id',C.eventoId).order('created_at',{ascending:false}).range(from,from+PAGE-1);loading=false;if(error){q('#sentinel').textContent='Não foi possível carregar mais fotos.';return}data=data||[];let fresh=data.filter(a=>!rows.some(b=>b.id===a.id));rows.push(...fresh);append(fresh);page++;hasMore=data.length===PAGE;q('#sentinel').textContent=hasMore?'':'Você chegou ao fim do álbum ✨'}
new IntersectionObserver(e=>{if(e[0].isIntersecting)loadMore()},{rootMargin:'500px'}).observe(q('#sentinel'));
function toast(n){let t=q('#toast');t.textContent='✨ '+n+' acabou de adicionar um novo momento';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),4200)}
S.channel('album-'+C.eventoId).on('postgres_changes',{event:'INSERT',schema:'public',table:'fotos',filter:'evento_id=eq.'+C.eventoId},p=>{if(!rows.some(r=>r.id===p.new.id)){rows.unshift(p.new);total++;updateCount();append([p.new],true);toast(p.new.nome_convidado)}}).subscribe();
q('#light').onclick=()=>q('#light').classList.remove('open');function open(){q('#creator').classList.add('open');draw()}q('#add').onclick=q('#fab').onclick=open;q('#close').onclick=()=>q('#creator').classList.remove('open');
function draw(){cx.fillStyle='#ddd';cx.fillRect(0,0,1080,1920);if(im){let s=im.fit*sc;cx.drawImage(im,x,y,im.width*s,im.height*s)}}function fit(){im.fit=Math.max(1080/im.width,1920/im.height);sc=1;q('#zoom').value=1;x=(1080-im.width*im.fit)/2;y=(1920-im.height*im.fit)/2;draw()}
function pick(e){let f=e.target.files[0];if(!f)return;let u=URL.createObjectURL(f),z=new Image;z.onload=()=>{im=z;fit();URL.revokeObjectURL(u)};z.src=u}q('#cameraFile').onchange=pick;q('#galleryFile').onchange=pick;q('#zoom').oninput=e=>{if(!im)return;let old=sc,n=+e.target.value;x=540-(540-x)*n/old;y=960-(960-y)*n/old;sc=n;draw()};
function tp(e){let r=ed.getBoundingClientRect();return{x:(e.clientX-r.left)*1080/r.width,y:(e.clientY-r.top)*1920/r.height}}let touches=new Map(),gesture=null;function beginGesture(){let a=[...touches.values()];if(a.length<2)return;let p1=a[0],p2=a[1];gesture={dist:Math.hypot(p2.x-p1.x,p2.y-p1.y),mx:(p1.x+p2.x)/2,my:(p1.y+p2.y)/2,scale:sc,x,y}}
ed.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'){if(!im)return;drag=1;ed.setPointerCapture(e.pointerId);let p=tp(e);sx=p.x;sy=p.y;bx=x;by=y;return}touches.set(e.pointerId,tp(e));if(touches.size===2){e.preventDefault();beginGesture()}});ed.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'){if(!drag)return;let p=tp(e);x=bx+p.x-sx;y=by+p.y-sy;draw();return}if(!touches.has(e.pointerId))return;touches.set(e.pointerId,tp(e));if(touches.size>=2&&im&&gesture){e.preventDefault();let a=[...touches.values()],p1=a[0],p2=a[1],dist=Math.hypot(p2.x-p1.x,p2.y-p1.y),mx=(p1.x+p2.x)/2,my=(p1.y+p2.y)/2,n=Math.max(1,Math.min(4,gesture.scale*(dist/gesture.dist))),ratio=n/gesture.scale;sc=n;x=mx-(gesture.mx-gesture.x)*ratio;y=my-(gesture.my-gesture.y)*ratio;q('#zoom').value=sc;draw()}});function end(e){if(e.pointerType==='mouse')drag=0;touches.delete(e.pointerId);if(touches.size<2)gesture=null}ed.addEventListener('pointerup',end);ed.addEventListener('pointercancel',end);
async function compose(){if(!im)throw Error('Escolha uma foto primeiro.');let o=document.createElement('canvas');o.width=1080;o.height=1920;let c=o.getContext('2d');c.drawImage(cv,0,0);let f=new Image;await new Promise((ok,no)=>{f.onload=ok;f.onerror=no;f.src=C.moldura});c.drawImage(f,0,0,1080,1920);return new Promise(ok=>o.toBlob(ok,'image/webp',C.qualidadeWebp||.82))}
async function makeThumb(blob){let bmp=await createImageBitmap(blob),o=document.createElement('canvas');o.width=360;o.height=640;o.getContext('2d').drawImage(bmp,0,0,360,640);bmp.close?.();return new Promise(ok=>o.toBlob(ok,'image/webp',.68))}
async function shareBlob(blob){let f=new File([blob],'meu-momento.webp',{type:'image/webp'});if(navigator.canShare?.({files:[f]}))await navigator.share({files:[f],title:C.evento.titulo});else{let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=f.name;a.click()}}
q('#share').onclick=async()=>{try{q('#status').textContent='Preparando sua foto…';let b=await compose();await shareBlob(b);q('#status').textContent=''}catch(e){q('#status').textContent=e.message}};
q('#publish').onclick=async()=>{let st=q('#status'),btn=q('#publish'),n=q('#guest').value.trim();if(!n){st.textContent='Digite seu nome para publicar.';return}try{btn.disabled=true;q('#progress').style.display='block';st.textContent='Preparando seu momento…';let b=await compose();lastBlob=b;let tb=await makeThumb(b),safe=n.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').toLowerCase().slice(0,25)||'convidado',name=Date.now()+'-'+safe+'-'+crypto.randomUUID().slice(0,8)+'.webp',path=C.eventoId+'/'+name,tpath=C.eventoId+'/thumbs/'+name;st.textContent='Enviando para o álbum…';let u=await S.storage.from(C.bucket).upload(path,b,{contentType:'image/webp',cacheControl:'31536000'});if(u.error)throw u.error;let tu=await S.storage.from(C.bucket).upload(tpath,tb,{contentType:'image/webp',cacheControl:'31536000'});if(tu.error)console.warn('Thumbnail:',tu.error);let r=await S.from('fotos').insert({evento_id:C.eventoId,nome_convidado:n,arquivo:path}).select().single();if(r.error){await S.storage.from(C.bucket).remove([path,tpath]);throw r.error}st.textContent='Momento compartilhado ✨';q('#creator').classList.remove('open');q('#success').classList.add('open');if(!rows.some(z=>z.id===r.data.id)){rows.unshift(r.data);total++;updateCount();append([r.data],true)}}catch(e){console.error(e);st.textContent='Não foi possível enviar. Sua foto continua aqui — toque novamente em “Adicionar ao álbum” para tentar de novo.'}finally{btn.disabled=false;q('#progress').style.display='none'}};
q('#shareAfter').onclick=async()=>{if(lastBlob)try{await shareBlob(lastBlob)}catch(e){console.error(e)}};q('#backAlbum').onclick=()=>{q('#success').classList.remove('open');window.scrollTo({top:0,behavior:'smooth'})};getTotal();loadMore();})();
</script></body></html>
